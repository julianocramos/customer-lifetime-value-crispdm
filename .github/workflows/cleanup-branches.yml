name: Clean temporary branches

on:
  push:
    branches: [main]
    paths:
      - 'CLEANUP_BRANCHES'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete temporary branches
        run: |
          git push origin --delete assets-final final-assets upload-assets upload-assets-2 || true
      - name: Remove cleanup files
        run: |
          git config user.name 'Juliano Ramos'
          git config user.email '69549005+julianocramos@users.noreply.github.com'
          git rm CLEANUP_BRANCHES .github/workflows/cleanup-branches.yml
          git commit -m 'Clean temporary publication branches'
          git push
